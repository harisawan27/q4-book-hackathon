<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="robot-glow">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Head Shape -->
  <path d="M60 50 H140 L150 80 V140 H50 V80 L60 50Z" fill="#1a2a3a" stroke="#00f2ff" stroke-width="2"/>
  
  <!-- Eyes (Visor) -->
  <rect x="65" y="90" width="70" height="20" rx="5" fill="#000"/>
  <rect x="70" y="95" width="20" height="10" rx="2" fill="#00f2ff" filter="url(#robot-glow)"/>
  <rect x="110" y="95" width="20" height="10" rx="2" fill="#00f2ff" filter="url(#robot-glow)"/>

  <!-- Antennae -->
  <path d="M50 80 L30 60" stroke="#00f2ff" stroke-width="2"/>
  <circle cx="30" cy="60" r="4" fill="#00f2ff"/>
  
  <path d="M150 80 L170 60" stroke="#00f2ff" stroke-width="2"/>
  <circle cx="170" cy="60" r="4" fill="#00f2ff"/>

  <!-- Mouth/Grill -->
  <line x1="80" y1="125" x2="120" y2="125" stroke="#333" stroke-width="2"/>
  <line x1="85" y1="130" x2="115" y2="130" stroke="#333" stroke-width="2"/>
</svg>
