<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="board_gradient" x1="0" y1="0" x2="200" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1a2a3a"/>
      <stop offset="1" stop-color="#0d1520"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- PCB Board -->
  <rect x="20" y="40" width="160" height="120" rx="10" fill="url(#board_gradient)" stroke="#00f2ff" stroke-width="2"/>
  
  <!-- Mounting Holes -->
  <circle cx="30" cy="50" r="4" fill="#111" stroke="#444" stroke-width="1"/>
  <circle cx="170" cy="50" r="4" fill="#111" stroke="#444" stroke-width="1"/>
  <circle cx="30" cy="150" r="4" fill="#111" stroke="#444" stroke-width="1"/>
  <circle cx="170" cy="150" r="4" fill="#111" stroke="#444" stroke-width="1"/>

  <!-- Main Processor (Nano Banana) -->
  <rect x="70" y="70" width="60" height="60" rx="2" fill="#111" stroke="#333"/>
  <text x="100" y="100" font-family="monospace" font-size="10" fill="#00f2ff" text-anchor="middle" alignment-baseline="middle" font-weight="bold">NANO</text>
  <text x="100" y="112" font-family="monospace" font-size="10" fill="#00f2ff" text-anchor="middle" alignment-baseline="middle" font-weight="bold">BANANA</text>
  
  <!-- Chips -->
  <rect x="40" y="70" width="20" height="30" fill="#222"/>
  <rect x="140" y="70" width="20" height="30" fill="#222"/>
  
  <!-- Traces -->
  <path d="M70 80 H50 M70 90 H50 M70 100 H50" stroke="#00f2ff" stroke-width="1" opacity="0.5"/>
  <path d="M130 80 H150 M130 90 H150 M130 100 H150" stroke="#00f2ff" stroke-width="1" opacity="0.5"/>
  <path d="M100 70 V60 M90 70 V60 M110 70 V60" stroke="#00f2ff" stroke-width="1" opacity="0.5"/>
  <path d="M100 130 V140 M90 130 V140 M110 130 V140" stroke="#00f2ff" stroke-width="1" opacity="0.5"/>

  <!-- GPIO Header -->
  <rect x="30" y="135" width="140" height="10" fill="#333"/>
  <circle cx="35" cy="140" r="2" fill="#gold"/>
  <circle cx="45" cy="140" r="2" fill="#gold"/>
  <circle cx="55" cy="140" r="2" fill="#gold"/>
  <!-- ... more pins implied -->
</svg>
